<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cem-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4176E6"/>
      <stop offset="1" stop-color="#2B4FA8"/>
    </linearGradient>
  </defs>

  <!-- the plate: same 16:1 corner ratio DSH uses for tiles -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#cem-bg)"/>

  <!-- an indent rail: what the sidebar's own column looks like -->
  <path d="M17.5 14v36" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/>

  <!-- a group title, then its two entries -->
  <rect x="23" y="15.5" width="13" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="20" y="23.5" width="27" height="4.6" rx="2.3" fill="#FFFFFF"/>
  <rect x="20" y="32.5" width="20.5" height="4.6" rx="2.3" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- a second group title, deeper, and one entry under it -->
  <rect x="23" y="41.5" width="9.5" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="26" y="48" width="21" height="4.6" rx="2.3" fill="#FFFFFF" fill-opacity="0.72"/>
</svg>
